<!doctype html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<title>FTTH Planner</title>
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
<header id="top">
  <button id="btnMenu" class="ib" title="Menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="brand"><b id="pname">FTTH</b><small id="psub"></small></div>
  <div class="grow"></div>
  <div class="searchbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="search" type="search" autocomplete="off"><div id="searchRes"></div></div>
  <button id="btnUndo" class="ib" data-tip="undo"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 010 10h-3"/></svg></button>
  <button id="btnRedo" class="ib" data-tip="redo"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 000 10h3"/></svg></button>
  <button id="btnImg" class="ib on" data-tip="toggle_img"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg></button>
  <button id="btnFit" class="ib" data-tip="fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="btnLang" class="chip">EN</button>
  <button id="btnPanel" class="ib on" data-tip="toggle_panel"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
</header>
<div id="work">
  <nav id="tools"></nav>
  <main id="stage">
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="hud"><div id="coords"></div><div id="scalebar"></div></div>
    <div id="hint"></div>
    <div id="legend"></div>
    <div id="zoomctl"><button id="zIn" class="ib">+</button><button id="zOut" class="ib">−</button></div>
  </main>
  <aside id="inspector"></aside>
</div>
<footer id="status"></footer>
<div id="scrim"></div>
<aside id="drawer"></aside>
<div id="modal"><div class="mbox"><div class="mhead"><b id="mtitle"></b><button id="mclose" class="ib">×</button></div><div class="mbody" id="mbody"></div><div class="mfoot" id="mfoot"></div></div></div>
<div id="toast"></div>
<script src="js/survey.js?v=1"></script>
<script src="js/core.js?v=1"></script>
<script src="js/i18n.js?v=1"></script>
<script src="js/app.js?v=1"></script>
<script src="js/dialogs.js?v=1"></script>
<script>window.FTAPP && FTAPP.start();</script>
</body>
</html>
